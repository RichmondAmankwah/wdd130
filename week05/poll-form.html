<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>polling form to be filled </title>
</head>

<body>
    <header>
        <h1>polling up here</h1>
    </header>
    <main>
        <form>
            <label for="fullname">Full Name: </label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="useremail">Email:</label>
            <input type="text" id="useremail" name="useremail" required>
            <label for="browser">what is your favorite browser? </label>
            <select name="browser" id="browser">
                <option value="1">chrome</option>
                <option value="2">safari</option>
                <option value="3">firefox</option>
            </select>
            <label for="pet">do you have a pet? </label>
            <input type="checkbox" id="pet" name="pet" required>
            <label for="feedback">list the places you have lived? </label>
            <textarea id="feedback" name="feedback" rows="5"
              placeholder="florida,argentina..."></textarea>
            <button type="submit">submit sharp </button>
        </form>
    </main>
    <footer>
        <p>Richmond Amankwah 2026 and vybing</p>
    </footer>
</body>

</html>
